# Template: copy to the project root and run `lefthook install`.
# /lux-preparar adds the stack-specific commands (lint, types) to pre-commit.
# Needs gitleaks and lefthook on PATH. Keep each `run:` block as the only content
# of its command: tests/test_lefthook.sh extracts and executes them.

pre-commit:
  commands:
    lint:
      run: npm run lint
    types:
      run: npx tsc --noEmit
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    frozen-files:
      run: |
        case "$(git symbolic-ref --short HEAD 2>/dev/null)" in feature/*) ;; *) exit 0 ;; esac
        frozen=$(git -c core.quotePath=false diff --cached --name-only --no-renames | grep -E '(^|/)docs/hu/[^/]+/(spec\.md|criteria\.lock)$|(^|/)docs/hu/.+\.feature$')
        if [ -n "$frozen" ]; then
          echo "Arquivos congelados da HU não mudam em feature/*:" >&2
          echo "$frozen" >&2
          exit 1
        fi

commit-msg:
  commands:
    format:
      run: |
        msg=$(head -n 1 {1})
        case "$msg" in Merge\ *|Revert\ *) exit 0 ;; esac
        if ! printf '%s\n' "$msg" | grep -Eq '^((feat|fix|chore|docs|test|refactor|perf|style|build|ci)\((HU|FIX|CHORE)-[0-9]+\): .+|chore\(RELEASE\): v[0-9]+\.[0-9]+\.[0-9]+.*)$'; then
          echo "Mensagem fora do padrão tipo(HU-xx|FIX-xx|CHORE-xx): descrição (ou chore(RELEASE): vX.Y.Z)" >&2
          exit 1
        fi

pre-push:
  # The guard of the push of main: lux pre-push recomputes the verify (seal, suite, criteria, dependencies) over what is
  # being sent, anchored on origin/main, instead of trusting verification.md or the local marker (CHORE-17). Other branches pass.
  commands:
    verificar-main:
      use_stdin: true
      run: |
        if [ ! -f .lux/lux.py ]; then
          echo "pre-push: .lux/lux.py não existe; rode lux atualizar-projeto" >&2
          exit 1
        fi
        python3 .lux/lux.py pre-push
